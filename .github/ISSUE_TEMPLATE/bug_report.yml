name: Bug report
description: Something is broken or behaves unexpectedly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please search existing issues first, and use
        [Discussions](https://github.com/lynote-ai/lynote-notes/discussions) for questions.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. lynote-notes add examples/sample-lecture.md
        2. lynote-notes note --title "Test"
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit hash.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.9 / 3.11 / 3.12"
    validations:
      required: false
  - type: dropdown
    id: install
    attributes:
      label: Installation method
      options:
        - pip install -e .
        - pip install -e ".[all]"
        - Source checkout without install
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or traceback
      render: shell
    validations:
      required: false
