[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lynote-notes"
version = "0.1.0"
description = "Source-grounded, bilingual, local-first AI note taker: turn documents, audio, video and links into notes you can trace, edit and reuse."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Lynote", email = "support@lynote.ai" }]
keywords = ["ai-notes", "note-taker", "source-grounded", "rag", "transcription", "bilingual", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Text Processing",
]
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=3.0"]
docx = ["python-docx>=1.0"]
media = ["faster-whisper>=1.0"]
youtube = ["yt-dlp>=2024.1"]
all = ["pypdf>=3.0", "python-docx>=1.0", "faster-whisper>=1.0", "yt-dlp>=2024.1"]
dev = ["pytest>=7"]

[project.scripts]
lynote-notes = "lynote_notes.cli:main"

[project.urls]
Homepage = "https://github.com/lynote-ai/lynote-notes"
Repository = "https://github.com/lynote-ai/lynote-notes"
Issues = "https://github.com/lynote-ai/lynote-notes/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
